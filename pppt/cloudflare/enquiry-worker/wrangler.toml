# Enquiry form endpoint for the Pulse Performance PT site.
# Deploy: npx wrangler deploy   (from this folder)
# Secrets: npx wrangler secret put ENQUIRY_TO / ENQUIRY_FROM / TURNSTILE_SECRET

name = "pppt-enquiry"
main = "worker.js"
compatibility_date = "2026-09-01"

# Sits on top of the Pages site: only this one path goes to the Worker.
routes = [
  { pattern = "pulseperformancept.com.au/api/enquiry", zone_name = "pulseperformancept.com.au" },
  { pattern = "www.pulseperformancept.com.au/api/enquiry", zone_name = "pulseperformancept.com.au" },
]

# Needs Email Routing enabled on the domain, with ENQUIRY_TO verified as a
# destination address.
[[send_email]]
name = "EMAIL"
