<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Aaron Lees — personal site and blog.">
  <title>Aaron Lees</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b5fe9'/%3E%3Ctext x='32' y='44' font-family='-apple-system,Helvetica,Arial,sans-serif' font-size='34' font-weight='700' fill='white' text-anchor='middle'%3EAL%3C/text%3E%3C/svg%3E">
  <script>
    /* Applied before styles load: stored theme (avoids a flash of the wrong
       theme) and logged-in state (avoids a flash of the login screen). */
    try {
      var t = localStorage.getItem('theme');
      if (t) {
        t = t.replace(/"/g, ''); // migrate legacy JSON-quoted values
        localStorage.setItem('theme', t);
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      }
    } catch (e) {}
    try { if (sessionStorage.getItem('loggedIn') === '1') document.documentElement.dataset.loggedIn = '1'; } catch (e) {}
    try { var sk = localStorage.getItem('skin'); if (sk === 'win') document.documentElement.dataset.skin = 'win'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="./css/base.css?v=20260718i">
  <link rel="stylesheet" href="./css/macos.css?v=20260718i">
  <link rel="stylesheet" href="./css/ios.css?v=20260718i">
  <link rel="stylesheet" href="./css/windows.css?v=20260718i">
</head>
<body>

  <!-- ======================= Login screen ======================= -->
  <div id="login-screen">
    <!-- Same graffiti as the desktop, but decorative here — you can't open
         an app from the lock screen -->
    <svg class="wall-scribble wall-scribble-login" viewBox="0 0 360 100" aria-hidden="true">
      <text x="8" y="46" textLength="330" lengthAdjust="spacingAndGlyphs">trust but verify</text>
      <path d="M12 64 C 74 74, 176 56, 344 66"/>
      <path d="M56 79 C 128 87, 214 70, 308 78"/>
    </svg>
    <div class="login-clock">
      <time class="login-clock-time"></time>
      <span class="login-clock-date"></span>
    </div>

    <div class="login-users">
      <button class="login-user" data-user="aaron">
        <img class="login-avatar" src="./assets/headshot.svg" alt="" width="84" height="84">
        <span>Aaron Lees</span>
      </button>
      <button class="login-user" data-user="guest">
        <span class="login-avatar login-avatar-guest">
          <svg class="icon" width="42" height="42" aria-hidden="true"><use href="#icon-user"/></svg>
        </span>
        <span>Guest Account</span>
      </button>
    </div>

    <div class="login-aaron" hidden>
      <img class="login-avatar login-avatar-big" src="./assets/headshot.svg" alt="" width="96" height="96">
      <span class="login-aaron-name">Aaron Lees</span>
      <div class="login-pw-box">
        <!-- contenteditable, masked via CSS — a real password input would summon
             password managers for a password that can never be correct -->
        <span class="login-pw-field" contenteditable="true" role="textbox" aria-label="Password"
              spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go"></span>
        <button class="login-pw-go" aria-label="Log in">→</button>
      </div>
      <p class="login-hint" role="status"></p>
      <button class="login-back">Cancel</button>
    </div>
  </div>

  <!-- ======================= macOS shell ======================= -->
  <div id="macos-root">
    <header id="menubar">
      <div class="menubar-left">
        <button id="menu-logo" class="menubar-item" aria-label="Site menu" aria-haspopup="true" aria-expanded="false">
          <img class="menubar-avatar" src="./assets/headshot.svg" alt="" width="18" height="18">
        </button>
        <span class="menubar-item menubar-title">Aaron Lees</span>
        <button class="menubar-item menubar-nav" data-open-app="about">About</button>
        <button class="menubar-item menubar-nav" data-open-app="resume">Résumé</button>
        <button class="menubar-item menubar-nav" data-open-app="blog">Blog</button>
        <button class="menubar-item menubar-nav" data-open-app="projects">Projects</button>
        <button class="menubar-item menubar-nav" data-open-app="contact">Contact</button>
      </div>
      <div class="menubar-right">
        <button id="wifi-toggle" class="menubar-item" aria-label="Wi-Fi networks" aria-haspopup="true" aria-expanded="false">
          <svg class="icon" width="16" height="12" aria-hidden="true"><use href="#icon-wifi"/></svg>
        </button>
        <span id="menubar-battery" class="menubar-item" role="img"></span>
        <button id="theme-toggle" class="menubar-item" aria-label="Toggle light or dark appearance" aria-pressed="false">
          <svg class="icon theme-icon-sun" width="15" height="15" aria-hidden="true"><use href="#icon-sun"/></svg>
          <svg class="icon theme-icon-moon" width="15" height="15" aria-hidden="true"><use href="#icon-moon"/></svg>
        </button>
        <time id="menubar-clock" class="menubar-item"></time>
      </div>
    </header>

    <!-- System menu: sibling of the menubar, NOT a child — the Windows skin
         hides #menubar with display:none, which would take the menu with it -->
    <ul id="logo-menu" class="menu-dropdown" hidden>
      <li><button data-open-app="sysinfo">About This Site</button></li>
      <li><button id="menu-skin">Restart into Windows…</button></li>
      <li><button id="menu-logout">Log Out Guest…</button></li>
      <li><button id="menu-restart">Restart…</button></li>
    </ul>

    <main id="desktop" aria-label="Desktop">
      <div id="desktop-widgets" aria-label="World clocks"></div>
      <!-- Wallpaper graffiti: a frustrated developer's note-to-self. Secretly a
           button (same destination as the AI credit) — it sits at z-index 0, so
           windows above it always win the click. -->
      <button class="wall-scribble" data-open-app="ai" aria-label="Trust but verify — my opinion on utilising AI for code">
        <svg viewBox="0 0 360 100" aria-hidden="true">
          <text x="8" y="46" textLength="330" lengthAdjust="spacingAndGlyphs">trust but verify</text>
          <path d="M12 64 C 74 74, 176 56, 344 66"/>
          <path d="M56 79 C 128 87, 214 70, 308 78"/>
        </svg>
      </button>
      <button class="ai-credit" data-open-app="ai">✦ Assisted by Claude — here's my take</button>
    </main>

    <nav id="dock" aria-label="Dock"></nav>

    <div id="win-tray">
      <button id="win-wifi-toggle" aria-label="Wi-Fi networks" aria-haspopup="true" aria-expanded="false">
        <svg class="icon" width="17" height="12" aria-hidden="true"><use href="#icon-wifi"/></svg>
      </button>
      <button id="win-theme-toggle" aria-label="Toggle light or dark appearance">
        <svg class="icon theme-icon-sun" width="15" height="15" aria-hidden="true"><use href="#icon-sun"/></svg>
        <svg class="icon theme-icon-moon" width="15" height="15" aria-hidden="true"><use href="#icon-moon"/></svg>
      </button>
      <span id="win-battery" role="img"></span>
      <span class="win-datetime"><time id="win-clock"></time><span id="win-date"></span></span>
    </div>
  </div>

  <div id="reboot-screen" hidden>
    <div class="reboot-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="reboot-text">Restarting…</p>
  </div>

  <!-- Wi-Fi menu: direct child of <body> on purpose — it's shared by the
       macOS menubar, the Windows tray, AND the iOS status bar, and every one
       of those lives in a container some skin or mode hides (rule 5).
       Populated by js/wifi.js. -->
  <div id="wifi-menu" hidden></div>

  <!-- What you get for joining Free Public Wi-Fi. Lines typed by js/wifi.js. -->
  <div id="pwned-screen" hidden>
    <div class="pwned-inner">
      <pre class="pwned-lines" aria-live="polite"></pre>
      <button class="pwned-return" hidden>[ disconnect and never speak of this again ]</button>
    </div>
  </div>

    <main id="ios-home" aria-label="Home Screen">      <div id="ios-widgets" aria-label="World clocks"></div>
      <div id="ios-icon-grid"></div>
      <button class="wall-scribble wall-scribble-ios" data-open-app="ai" aria-label="Trust but verify — my opinion on utilising AI for code">
        <svg viewBox="0 0 360 100" aria-hidden="true">
          <text x="8" y="46" textLength="330" lengthAdjust="spacingAndGlyphs">trust but verify</text>
          <path d="M12 64 C 74 74, 176 56, 344 66"/>
          <path d="M56 79 C 128 87, 214 70, 308 78"/>
        </svg>
      </button>
      <button class="ai-credit ai-credit-ios" data-open-app="ai">✦ Assisted by Claude — here's my take</button>

    <section id="ios-appview" role="dialog" aria-modal="false" aria-hidden="true">

  <template id="app-about">
    <div class="about-hero">
      <span class="about-avatar" aria-hidden="true">AL</span>
      <div>
        <h1>Aaron Lees</h1>
        <p class="about-tagline">Technology consultant &middot; Australia</p>
      </div>
    </div>
    <p>G'day — I'm Aaron. I work in technology consulting, spending most of my time in cloud platforms and systems integration: designing, building, and running the plumbing that keeps businesses talking to themselves.</p>
    <p>This site is my desk on the internet — a home for the occasional blog post, things I've built, and ways to get in touch. It's built with plain HTML, CSS, and JavaScript, no frameworks, and yes: the windows really drag.</p>
    <h2>Things I work with</h2>
    <ul class="chip-list">
      <li>Azure</li><li>Kubernetes</li><li>Integration</li><li>Automation</li><li>Platform engineering</li>
    </ul>
    <p class="fine-print">Want the longer version? Open <button class="inline-link" data-open-app="projects">Projects</button> or say hello via <button class="inline-link" data-open-app="contact">Contact</button>.</p>
  </template>

  <template id="app-resume">
    <!-- Position-led history, deliberately without company names.
         Sourced from Aaron's public LinkedIn; sectors stand in for logos. -->
    <h1>Résumé</h1>
    <p class="resume-intro">I started on the IT helpdesk of a pipeline engineering company in 2010 and never really left the trenches — I just kept upgrading the tools. Databases, then systems, then building the apps myself, then automating Linux fleets, then a decade of wiring organisations together with Boomi. These days I architect managed cloud platforms: Kubernetes on Azure, everything as code, everything observable. The through-line has always been the same — I like being the person who makes systems talk to each other.</p>
    <button class="resume-play" data-open-app="career">
      <span class="resume-play-tile" aria-hidden="true">▲</span>
      <span class="resume-play-text"><strong>View Interactive Résumé</strong>
      <small>the same 15 years as an 8-bit platformer — climb each era, find me at the top</small></span>
    </button>
    <div class="resume-stats">
      <div class="rs-stat"><span class="rs-num">15+</span><span class="rs-label">years in tech</span></div>
      <div class="rs-stat"><span class="rs-num">7+</span><span class="rs-label">years of Boomi</span></div>
      <div class="rs-stat"><span class="rs-num">7</span><span class="rs-label">industries served</span></div>
      <div class="rs-stat"><span class="rs-num">1</span><span class="rs-label">fake OS (this one)</span></div>
    </div>
    <div class="timeline">
      <div class="timeline-entry current" style="--dot: #7f8cff">
        <span class="tl-period">2022 — now</span>
        <h2>Principal Architect</h2>
        <p class="tl-org">National technology consultancy</p>
        <ul>
          <li>Architecture and delivery lead for a managed Azure cloud platform: AKS/Kubernetes fleets, Terraform, GitOps with ArgoCD, CI/CD on GitHub Actions.</li>
          <li>Boomi integration architecture across enterprise and government customers — designing it, building it, and carrying the pager for it.</li>
        </ul>
        <ul class="tl-tags"><li>Boomi</li><li>Azure</li><li>AKS</li><li>Terraform</li><li>ArgoCD</li><li>GitHub Actions</li></ul>
      </div>
      <div class="timeline-entry" style="--dot: #35c4d4">
        <span class="tl-period">2021 — 2024</span>
        <h2>Senior Integration Consultant</h2>
        <p class="tl-org">Consulting — utilities, energy, retail &amp; government engagements</p>

  <template id="app-ai">
    <!-- Aaron's opinion piece on AI-assisted development — the fine print
         behind the wallpaper's AI credit. Content direction is Aaron's;
         yes, an AI typed the essay about verifying what AIs type. -->
    <h1>My opinion on utilising AI for code</h1>
    <p class="ai-doc-byline">by Aaron, a human. The typing was outsourced — that's rather the point.</p>
    <p>Full disclosure, since you clicked the tagline: <strong>most of this website was AI-generated.</strong> The fake windows, the fake terminal, the fake battery that dies at 10pm — an AI wrote the bulk of it while I directed, reviewed, argued, and occasionally reverted. That's not a confession; it's a demonstration. Here's how I think this is supposed to work.</p>
    <h2>It's a very eager, very smart junior developer</h2>
    <p>That's the whole mental model. AI will do what you ask — and frequently a fair bit more than you asked — delivered with total confidence at 4:55pm on a Friday. Like any bright junior, it needs guidance, code review, and the occasional "walk me through why this exists". Provide neither and you deserve what ships.</p>
    <h2>Trust, but verify</h2>
    <p>The core principle — I've scribbled it on the wallpaper so neither of us forgets. Never let the AI rule the roost: review the commands before they run, and make sure everything it does has a reason and an explanation. If it can't give you one, that's your answer. If you can't explain a diff, you didn't write it — you witnessed it.</p>
    <h2>Do your own homework</h2>
    <p>Never assume the AI's way is best practice. It's fluent — confidently fluent — in patterns that were best practice three years ago, and in a few that never were. Independent research is still part of the job; the AI is a starting point with excellent typing speed, not a standards body.</p>
    <h2>The punch-card argument</h2>
    <p>AI is part of our lives now whether we accept it or not. Holding out for traditional methods on principle is like refusing to learn programming because punch cards exist. This is a transformative tool, and it will lead to innovations that simply weren't possible before. The interesting question stopped being "should we use it" a while ago — it's "how well".</p>
    <h2>Local models: lovely idea, not yet</h2>
    <p>Offline, self-hosted AI for serious work isn't plausible yet. We're clearly heading there, and I want it as much as anyone who reads privacy policies for fun — but today the big tasks still need the big models. This section ships with an expiry date; check back.</p>
    <h2>The sky is not falling</h2>
    <p>Technology isn't doomed because AI turned up. A skills gap is coming — particularly at junior levels — but the work doesn't vanish, it moves up a rung: directing, managing, and verifying AI is becoming the entry-level craft, the way manual memory management stopped being one. The trade changes; the trade survives. It always has.</p>
    <h2>Code only gets better from here</h2>
    <p>Standards, security, ambition — all of it improves, provided we do the research and use every tool on the bench: scanners, linters, tests, reviews, and the AI itself. You may notice a theme by now. <em>Trust, but verify.</em> It was true of compilers, true of Stack Overflow, and it's true of this.</p>
    <p class="fine-print">And yes — this whole site is AI at work, human at the wheel. The making-of story lives in the <button class="inline-link" data-open-app="blog" data-blog-tag="meta">Blog</button>.</p>
  </template>
